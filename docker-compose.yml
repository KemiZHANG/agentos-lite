services:
  backend:
    build:
      context: ./backend
    environment:
      AGENTOS_ENV: local
      AGENTOS_SQLITE_PATH: /data/agentos_lite.db
      AGENTOS_LLM_PROVIDER: mock
      AGENTOS_EMBEDDING_PROVIDER: mock
    volumes:
      - agentos-data:/data
      - ./examples:/app/examples:ro
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  agentos-data:

