services:
  - type: web
    name: agentos-lite-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-pro-preview
      - key: LLM_FALLBACK_TO_MOCK
        value: true
      - key: DEMO_MODE
        value: true
      - key: MAX_LLM_CALLS_PER_USER_PER_DAY
        value: 5
      - key: DEMO_FALLBACK_TO_MOCK
        value: true
      - key: STRICT_CITATION_MODE
        value: true
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
